name: Version Bump

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always

jobs:
  version-bump:
    name: Automatic Version Bump
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-version]')"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-bump
      run: cargo install cargo-bump

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Determine version bump type
      id: version_type
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "type=${{ github.event.inputs.version_type }}" >> $GITHUB_OUTPUT
        else
          # Analyze commit messages to determine version bump type
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MESSAGE" =~ ^(feat|feature)(\(.+\))?: ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MESSAGE" =~ ^(fix|bugfix)(\(.+\))?: ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MESSAGE" =~ ^(BREAKING|breaking)(\(.+\))?: ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Get current version
      id: current_version
      run: |
        VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Bump version
      id: bump_version
      run: |
        cargo bump ${{ steps.version_type.outputs.type }}
        NEW_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Update version in source files
      run: |
        # Update version in lib.rs documentation
        sed -i 's/version = "[0-9]\+\.[0-9]\+\.[0-9]\+"/version = "${{ steps.bump_version.outputs.new_version }}"/g' src/lib.rs || true

    - name: Commit version bump
      run: |
        git add .
        git commit -m "chore: bump version to v${{ steps.bump_version.outputs.new_version }} [skip-version]"
        git push

    - name: Create git tag
      run: |
        git tag "v${{ steps.bump_version.outputs.new_version }}"
        git push origin "v${{ steps.bump_version.outputs.new_version }}"

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ steps.bump_version.outputs.new_version }}"
        release_name: "Release v${{ steps.bump_version.outputs.new_version }}"
        draft: false
        prerelease: false
        body: |
          ## What's Changed
          
          Automated release from version bump workflow.
          
          **Version:** ${{ steps.current_version.outputs.version }} → ${{ steps.bump_version.outputs.new_version }}
          **Type:** ${{ steps.version_type.outputs.type }}
          
          ### Changes
          - Automatic version bump based on commit messages
          - See [CHANGELOG](https://github.com/julienmontagut/mightty/blob/main/CHANGELOG.md) for detailed changes
          
          ### Installation
          
          Binaries will be available shortly via the Release workflow.
          
          ### Commit Messages Format
          
          This project follows [Conventional Commits](https://www.conventionalcommits.org/):
          - `feat: description` → minor version bump
          - `fix: description` → patch version bump  
          - `BREAKING: description` → major version bump
          - Other commits → patch version bump
          
          Use `[skip-version]` in commit message to skip automatic versioning.