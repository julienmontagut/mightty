[package]
name = "mightty"
version = "0.1.0"
edition = "2021"
authors = ["Julien Montagut <_@julienmontagut.com>"]
description = "A modern, fast, and lightweight terminal emulator"
readme = "README.md"
homepage = "https://github.com/julienmontagut/mightty"
repository = "https://github.com/julienmontagut/mightty"
license = "GPL-3.0-or-later"
keywords = ["terminal", "emulator", "gui", "rust", "egui"]
categories = ["command-line-utilities", "gui"]
rust-version = "1.70"

[[bin]]
name = "mightty"
path = "src/main.rs"

[lib]
name = "mightty"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
eframe = { version = "0.31.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
] }
figment = { version = "0.10.19", features = ["env", "toml"] }
portable-pty = "0.9.0"
tokio = { version = "1.46.0", features = ["macros", "rt-multi-thread"] }
vte = "0.15.0"
serde = { version = "1.0.219", features = ["derive"] }
xdg = "3.0.0"

[features]
default = ["nerd-fonts"]
nerd-fonts = []
