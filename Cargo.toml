[package]
name = "mightty"
version = "0.1.0"
authors = ["Julien Montagut <_@julienmontagut.com>"]
license = "Apache-2.0"
description = "A fast, cross-platform, OpenGL terminal emulator"
readme = "README.md"
repository = "https://github.com/julienmontagut/mightty"
edition = "2024"

[dependencies]
ahash = { version = "0.8.6", features = ["no-rng"] }
base64 = "0.22.0"
bitflags = { version = "2.2.1", features = ["serde"] }
clap = { version = "4.2.7", features = ["derive", "env"] }
copypasta = { version = "0.10.1", default-features = false }
crossfont = "0.8.1"
figment = { version = "0.10.9", features = ["env", "toml"] }
glutin = { version = "0.32.2", default-features = false, features = ["egl"] }
home = "0.5.5"
libc = "0.2"
log = { version = "0.4", features = ["std", "serde"] }
notify = "8.0.0"
parking_lot = "0.12.0"
polling = "3.8.0"
regex-automata = "0.4.3"
rustix-openpty = "0.2.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3.10"
tempfile = "3.12.0"
toml = "0.8.2"
toml_edit = "0.22.21"
unicode-width = "0.2.0"
vte = { version = "0.15.0", default-features = false, features = [
    "std",
    "ansi",
    "serde",
] }
winit = { version = "0.30.9", default-features = false, features = [
    "rwh_06",
    "serde",
] }
xdg = "3.0.0"

[build-dependencies]
gl_generator = "0.14.0"
regex = "1.0"

[dev-dependencies]
clap_complete = "4.2.3"


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-foundation = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSString",
    "NSLocale",
] }
objc2-app-kit = { version = "0.3.1", default-features = false, features = [
    "std",
    "NSColorSpace",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[features]
default = ["wayland"]
wayland = [
    "copypasta/wayland",
    "glutin/wayland",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita-crossfont",
]

[profile.release]
lto = "thin"
debug = 1
incremental = false
